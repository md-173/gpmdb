<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin josh.beardmore@gmail.com
    ServerName gpmdb.net

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

    SSLCertificateFile    /etc/apache2/ssl/cert.pem
    SSLCertificateKeyFile /etc/apache2/ssl/privkey.pem

    #SSLCertificateFile /etc/letsencrypt/live/gws.gplates.org/cert.pem
    #SSLCertificateKeyFile /etc/letsencrypt/live/gws.gplates.org/privkey.pem
    #Include /etc/letsencrypt/options-ssl-apache.conf
    #SSLCertificateChainFile /etc/letsencrypt/live/gws.gplates.org/chain.pem

    SSLEngine on
    SSLProxyEngine on

    #ProxyPass / http://localhost:80/
    #ProxyPassReverse / http://localhost:80/

</VirtualHost>
</IfModule>

