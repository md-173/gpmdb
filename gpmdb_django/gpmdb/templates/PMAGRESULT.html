<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="GPMDB">
    <meta name="author" content="Michael Chin">
    <title>GPMDB</title>
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">

    <!-- Optional theme -->
    <link rel="stylesheet" href="/static/css/bootstrap-theme.min.css">

    <link rel="stylesheet" type="text/css" href="/static/css/jquery.dataTables.min.css"/>
    <link rel="stylesheet" type="text/css" href="/static/css/leaflet.css"/>
    <!-- Custom theme CSS -->
    <link rel="stylesheet" href="/static/css/custom.css"/>
</head>
<body>
   
    <div id="table-div"></div>

    <div>
        <button type="button" id="save-csv" class="btn btn-info pull-left">Save as CSV file</button>
    </div>
    <script src="/static/libs/jquery.min.js"></script>
     <!-- Latest compiled and minified JavaScript -->
    <script src="/static/libs/bootstrap.min.js" ></script>
    <script src="/static/libs/jquery.dataTables.min.js"></script>
    <script src="/static/libs/leaflet.js"></script>
    <script>
        var json_data;
        $(function() {
            $.ajax({
                "url": '/get_PMAGRESULT_data/?fmt=json&ROCKUNITNO={{ROCKUNITNO}}',
                "success": function(json) {
                    json_data = json;
                    var table_headers;
                    $.each(json.columns, function(i, val){
                        table_headers += "<th>" + val + "</th>";
                    });
                     
                    $("#table-div").empty();
                    $("#table-div").append('<table id="db-table" class="display" cellspacing="0" width="100%"><thead><tr></tr></thead></table>');
                    $("#table-div").find("table thead tr").append(table_headers);  
                     
                    $('#db-table').dataTable({"iDisplayLength": 25,aaData:json.data});
                },
                "dataType": "json"
            });
        });
        
        $('#save-csv').click(function(){
            save_csv();
        });

        function save_csv(){
            let csvContent = "data:text/csv;charset=utf-8," 
                + json_data.columns.join(",") + ("\n")
                + json_data.data.map(row => {
                    return row.map(e => {
                        if (typeof e === 'string' || e instanceof String){
                            e=e.replace("\"", "\"\"");
                            if(e.includes(",")){
                                return "\"" +e+"\"";
                            }
                        }
                        return e;
                        
                    }).join(",");
            
                }).join("\n");
                
            var downloadLink = document.createElement("a");
            downloadLink.href = csvContent;
            downloadLink.download = "PMAGRESULT-data.csv";

            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            //window.open(encodeURI(csvContent));
        }
    </script>

</body>
</html>
