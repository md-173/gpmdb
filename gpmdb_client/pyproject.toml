[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpmdb"
version = "0.1.0"
description = "Python client for the Global Paleomagnetic Database"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "GPMDB Team", email = "contact@gpmdb.net" }
]
keywords = ["paleomagnetism", "geology", "geophysics", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.25.0",
    "pandas>=1.3.0",
]

[project.urls]
Homepage = "https://gpmdb.net"

[tool.hatch.build.targets.wheel]
packages = ["src/gpmdb"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "responses>=0.23.0",
]